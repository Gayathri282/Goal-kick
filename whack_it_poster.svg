<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="65%" stop-color="#73d13d"/>
      <stop offset="100%" stop-color="#237804"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fffb8f" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffd666" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Gradients -->
    <radialGradient id="hamsterGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe7ba"/>
      <stop offset="60%" stop-color="#fa8c16"/>
      <stop offset="100%" stop-color="#d46b08"/>
    </radialGradient>

    <radialGradient id="bunnyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="70%" stop-color="#ffc53d"/>
      <stop offset="100%" stop-color="#d48806"/>
    </radialGradient>

    <radialGradient id="raccoonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="60%" stop-color="#8c8c8c"/>
      <stop offset="100%" stop-color="#434343"/>
    </radialGradient>

    <radialGradient id="holeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f0e04"/>
      <stop offset="75%" stop-color="#432611"/>
      <stop offset="100%" stop-color="#6b3e1b"/>
    </radialGradient>

    <!-- Text Gradients & Shadows -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffb8f"/>
      <stop offset="50%" stop-color="#ffc53d"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ffec3d" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Sky & Meadow Background -->
  <rect width="800" height="1200" fill="url(#skyGrad)"/>
  <circle cx="400" cy="360" r="450" fill="url(#sunGlow)"/>

  <!-- Sun rays -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="40" stroke-linecap="round">
    <line x1="400" y1="360" x2="0" y2="0"/>
    <line x1="400" y1="360" x2="800" y2="0"/>
    <line x1="400" y1="360" x2="100" y2="700"/>
    <line x1="400" y1="360" x2="700" y2="700"/>
  </g>

  <!-- Decorative Clouds -->
  <g fill="#ffffff" opacity="0.85" filter="url(#shadow)">
    <path d="M 100 220 A 45 45 0 0 1 180 200 A 60 60 0 0 1 290 220 A 40 40 0 0 1 330 260 L 90 260 Z"/>
    <path d="M 500 180 A 50 50 0 0 1 590 160 A 70 70 0 0 1 710 180 A 45 45 0 0 1 750 230 L 480 230 Z"/>
  </g>

  <!-- Poster Title Header -->
  <g filter="url(#shadow)" transform="translate(400, 160)">
    <!-- Title Background Badge -->
    <rect x="-260" y="-70" width="520" height="120" rx="60" fill="rgba(255, 255, 255, 0.92)" stroke="#ffffff" stroke-width="6"/>
    <text x="0" y="-8" font-family="'Fredoka', 'Trebuchet MS', sans-serif" font-size="64" font-weight="900" fill="#237804" text-anchor="middle" letter-spacing="4">SUPER CUTE ARCADE</text>
    
    <!-- Big 3D Title Text -->
    <text x="0" y="70" font-family="'Fredoka', 'Trebuchet MS', sans-serif" font-size="105" font-weight="900" fill="#d4380d" text-anchor="middle" letter-spacing="6">WHACK IT!</text>
    <text x="0" y="64" font-family="'Fredoka', 'Trebuchet MS', sans-serif" font-size="105" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">WHACK IT!</text>
  </g>

  <!-- Center Meadow Playfield Base -->
  <g transform="translate(400, 780)">
    <!-- Playground Ground Mat -->
    <ellipse cx="0" cy="180" rx="350" ry="140" fill="#389e0d" opacity="0.9"/>
    <ellipse cx="0" cy="180" rx="320" ry="120" fill="#52c41a"/>

    <!-- Bottom Hole 1 (Center Front - Golden Hamster) -->
    <g transform="translate(0, 160)">
      <ellipse cx="0" cy="40" rx="130" ry="50" fill="url(#holeGrad)"/>
      <ellipse cx="0" cy="35" rx="105" ry="35" fill="#1c0d05"/>

      <!-- Hamster Creature -->
      <g transform="translate(0, -60)" filter="url(#shadow)">
        <!-- Ears -->
        <circle cx="-65" cy="-60" r="28" fill="#fa8c16"/>
        <circle cx="-65" cy="-60" r="16" fill="#ffadd2"/>
        <circle cx="65" cy="-60" r="28" fill="#fa8c16"/>
        <circle cx="65" cy="-60" r="16" fill="#ffadd2"/>
        <!-- Head -->
        <circle cx="0" cy="0" r="85" fill="url(#hamsterGrad)"/>
        <!-- Muzzle & Cheeks -->
        <ellipse cx="0" cy="25" rx="55" ry="40" fill="#ffffff"/>
        <circle cx="-45" cy="15" r="16" fill="#ff7875" opacity="0.7"/>
        <circle cx="45" cy="15" r="16" fill="#ff7875" opacity="0.7"/>
        <!-- Eyes -->
        <circle cx="-32" cy="-15" r="15" fill="#1f1f1f"/>
        <circle cx="32" cy="-15" r="15" fill="#1f1f1f"/>
        <circle cx="-36" cy="-20" r="6" fill="#ffffff"/>
        <circle cx="28" cy="-20" r="6" fill="#ffffff"/>
        <!-- Nose & Smile -->
        <ellipse cx="0" cy="12" rx="10" ry="7" fill="#ff85c0"/>
        <path d="M -12 25 Q 0 38 12 25" stroke="#595959" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Crown -->
        <text x="0" y="-85" font-size="50" text-anchor="middle">👑</text>
      </g>
    </g>

    <!-- Top Left Hole (Golden Star Bunny) -->
    <g transform="translate(-200, 20)">
      <ellipse cx="0" cy="30" rx="100" ry="38" fill="url(#holeGrad)"/>
      <ellipse cx="0" cy="26" rx="80" ry="26" fill="#1c0d05"/>

      <!-- Bunny Creature -->
      <g transform="translate(0, -50)">
        <!-- Tall Ears -->
        <ellipse cx="-30" cy="-90" rx="18" ry="45" fill="#ffc53d" transform="rotate(-10 -30 -90)"/>
        <ellipse cx="-30" cy="-90" rx="10" ry="30" fill="#ffadd2" transform="rotate(-10 -30 -90)"/>
        <ellipse cx="30" cy="-90" rx="18" ry="45" fill="#ffc53d" transform="rotate(10 30 -90)"/>
        <ellipse cx="30" cy="-90" rx="10" ry="30" fill="#ffadd2" transform="rotate(10 30 -90)"/>
        <!-- Head -->
        <circle cx="0" cy="0" r="65" fill="url(#bunnyGrad)"/>
        <!-- Eyes -->
        <circle cx="-24" cy="-10" r="11" fill="#1f1f1f"/>
        <circle cx="24" cy="-10" r="11" fill="#1f1f1f"/>
        <circle cx="-27" cy="-14" r="4" fill="#ffffff"/>
        <circle cx="21" cy="-14" r="4" fill="#ffffff"/>
        <!-- Nose -->
        <polygon points="0,5 -7,0 7,0" fill="#ff85c0"/>
        <!-- Star Tag -->
        <text x="40" y="-45" font-size="32">⭐</text>
      </g>
    </g>

    <!-- Top Right Hole (Cheeky Raccoon) -->
    <g transform="translate(200, 20)">
      <ellipse cx="0" cy="30" rx="100" ry="38" fill="url(#holeGrad)"/>
      <ellipse cx="0" cy="26" rx="80" ry="26" fill="#1c0d05"/>

      <!-- Raccoon Creature -->
      <g transform="translate(0, -50)">
        <!-- Ears -->
        <polygon points="-45,-30 -70,-75 -15,-50" fill="#434343"/>
        <polygon points="-40,-35 -60,-68 -20,-50" fill="#ffadd2"/>
        <polygon points="45,-30 70,-75 15,-50" fill="#434343"/>
        <polygon points="40,-35 60,-68 20,-50" fill="#ffadd2"/>
        <!-- Head -->
        <circle cx="0" cy="0" r="65" fill="url(#raccoonGrad)"/>
        <!-- Bandit Mask -->
        <ellipse cx="0" cy="-5" rx="55" ry="24" fill="#262626"/>
        <!-- Eyes -->
        <circle cx="-24" cy="-5" r="10" fill="#ff4d4f"/>
        <circle cx="24" cy="-5" r="10" fill="#ff4d4f"/>
        <!-- Nose -->
        <circle cx="0" cy="15" r="8" fill="#000000"/>
      </g>
    </g>
  </g>

  <!-- Sparkle Effects -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M 180 480 Q 180 500 200 500 Q 180 500 180 520 Q 180 500 160 500 Q 180 500 180 480 Z"/>
    <path d="M 640 440 Q 640 460 660 460 Q 640 460 640 480 Q 640 460 620 460 Q 640 460 640 440 Z"/>
    <path d="M 400 340 Q 400 355 415 355 Q 400 355 400 370 Q 400 355 385 355 Q 400 355 400 340 Z"/>
  </g>

  <!-- Minimal Footer Badge -->
  <g transform="translate(400, 1140)">
    <rect x="-180" y="-30" width="360" height="48" rx="24" fill="rgba(255, 255, 255, 0.95)" stroke="#73d13d" stroke-width="3" filter="url(#shadow)"/>
    <text x="0" y="2" font-family="'Fredoka', 'Trebuchet MS', sans-serif" font-size="20" font-weight="700" fill="#278003" text-anchor="middle">TAP • HAVE FUN • PLAY NOW 🚀</text>
  </g>
</svg>
